services:
  db:
    image: postgres:16
    container_name: assistant-litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: litellm
    volumes:
      - litellm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U litellm -d litellm" ]
      interval: 5s
      timeout: 5s
      retries: 5

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-latest
    container_name: assistant-litellm-proxy
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set in .env}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@db:5432/litellm
    command: [ "--config", "/app/config.yaml", "--port", "4000" ]

  sandbox:
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
    container_name: assistant-sandbox
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ./workspace:/workspace
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: assistant-phoenix
    restart: unless-stopped
    ports:
      - "127.0.0.1:6006:6006"   # Web UI и OTLP HTTP collector (/v1/traces)
      - "127.0.0.1:4317:4317"   # OTLP gRPC collector
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_ENABLE_AUTH: "false"
    volumes:
      - phoenix_data:/mnt/data

  daemon:
    build:
      context: .
      dockerfile: docker/daemon.Dockerfile
    container_name: assistant-daemon
    restart: unless-stopped
    depends_on:
      - litellm
      - phoenix
      - sandbox
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_VIRTUAL_KEY: ${LITELLM_VIRTUAL_KEY}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-assistant-main}
      ASSISTANT_FAST_MODEL: ${ASSISTANT_FAST_MODEL:-assistant-fast}
      ASSISTANT_EMBED_MODEL: ${ASSISTANT_EMBED_MODEL:-assistant-embed}
      PHOENIX_OTLP_ENDPOINT: http://phoenix:6006/v1/traces
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_CHAT_ID: ${TELEGRAM_ALLOWED_CHAT_ID}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      EXTERNAL_ICS_URL: ${EXTERNAL_ICS_URL:-workspace/itmo.ics}
      CALENDAR_TIMEZONE: ${CALENDAR_TIMEZONE:-Europe/Moscow}
      GITLAB_URL: ${GITLAB_URL:-https://gitlab.education.tbank.ru}
      GITLAB_TOKEN: ${GITLAB_TOKEN}
      GITLAB_SSL_VERIFY: ${GITLAB_SSL_VERIFY:-false}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD}
      EMAIL_IMAP_HOST: ${EMAIL_IMAP_HOST:-imap.gmail.com}
      EMAIL_IMAP_PORT: ${EMAIL_IMAP_PORT:-993}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.gmail.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  litellm_pg_data:
  phoenix_data: