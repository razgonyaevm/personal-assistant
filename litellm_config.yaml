model_list:
  # Основная модель для агента и tool calling
  - model_name: assistant-main
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
      timeout: 20
      rpm: 30

  # Быстрая/дешёвая модель для compaction и fallback
  - model_name: assistant-fast
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      timeout: 15
      rpm: 60

  - model_name: assistant-backup
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      timeout: 20
      rpm: 30

  - model_name: assistant-embed
    litellm_params:
      model: gemini/gemini-embedding-001
      api_key: os.environ/GEMINI_API_KEY
      timeout: 20

router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    - { "assistant-main": [ "assistant-fast", "assistant-backup" ] }

litellm_settings:
  drop_params: true
  num_retries: 1
  request_timeout: 25

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL